<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NESTFOAM - Generator stopki e-mail</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <!-- Cropper.js -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <style>

    body { font-family: Arial, serif; background:#FFFFFF; color:#444444; margin:0; padding:0; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
    header { display:flex; align-items:center; gap:20px; padding:20px 40px; border-bottom:4px solid #00A19A; background:#FFFFFF; color:#000}
    header img { width:80px; height:80px; border-radius:0px; object-fit:contain; }
    h1 { margin:0; font-size:48px; font-weight:400; }

    .container { display:flex; gap:40px; padding:40px; align-items:flex-start; box-sizing:border-box; }

    .form-card { flex:1; background:#fff; padding:20px; border-radius:12px; border:1px solid #ddd; box-shadow:0 10px 16px rgba(0,0,0,0.1); }
    label { display:block; margin-top:12px; font-weight:bold; }
    input[type="text"], input[type="email"], input { width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; margin-top:6px; box-sizing:border-box; font-size:14px; }
    button { background:#00A19A; color:#fff; border:none; padding:12px 30px; margin-top:20px; font-size:16px; font-weight:bold; border-radius:50px; cursor:pointer; }
    button:hover { opacity:0.90; }

    .preview {
      flex:1;
      border-left:2px solid #00A19A;
      padding-left:30px;
      box-sizing:border-box;
      position:sticky;
      top:20px;
      align-self:flex-start;
    }

    .iframe-wrap {
      width:100%;
      overflow:auto;
      padding:4px;
      box-sizing:border-box;
      background:transparent;
    }

    iframe {
      width:100%;
      max-width:600px;
      height: calc(100vh - 400px);
      border:1px solid #ccc;
      border-radius:10px;
      display:block;
      background:#ffffff;
      padding:20px;
      box-sizing:border-box;
    }

    .actions {
      margin-top:15px;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    /* MODAL KADROWANIA ZDJĘCIA */
    #cropModal {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.7);
      justify-content:center;
      align-items:center;
      z-index:9999;
      font-size:14px;
    }
    #cropBox {
      background:#fff;
      padding:40px;
      border-radius:12px;
      max-width:90%;
      max-height:90%;
      text-align:center;
      box-sizing:border-box;
      overflow:auto;
    }
    #cropPreviewWrap {
      width:320px;
      height:320px;
      margin:auto;
      border-radius:50%;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
    }

    #cropImage { max-width:100%; max-height:100%; display:block; }

    
    @media(max-width:1100px){
      .container{flex-direction:column;padding:20px;}
      .preview{border-left:none;padding-left:0;position:static;}
      iframe { width:100%; height:300px; }
    }

    
    @media (max-width: 768px) {

      
      header {
        flex-direction:column;
        text-align:center;
        gap:10px;
        padding:18px 16px;
      }

      header img {
        width:60px;
        height:60px;
      }

      header h1 {
        font-size:28px;
        line-height:1.15;
        margin:0;
      }

      
      .container {
        flex-direction:column;
        padding:14px;
        gap:18px;
      }

      .form-card {
        width:100%;
        padding:16px;
        box-sizing:border-box;
      }

      .preview {
        width:100%;
        padding-left:0;
        border-left:none;
        position:static;
      }

      .iframe-wrap {
        width:100%;
        padding:0;
      }

   
      iframe {
        width:100%;
        height:420px;
        max-width:100%;
        padding:12px;
        border-radius:8px;
      }

      
      .actions {
        flex-direction:column;
        gap:8px;
        margin-top:8px;
      }

      .actions button {
        width:100%;
        padding:12px;
        border-radius:50px;
        font-size:16px;
        box-sizing:border-box;
      }

     
      #photoPreview {
        width:100px;
        height:100px;
        margin-top:10px;
      }

      
      #cropBox {
        width:95%;
        padding:20px;
      }

      #cropPreviewWrap {
        width:240px;
        height:240px;
      }

      
      input[type="text"], input[type="email"], input {
        font-size:15px;
        padding:12px;
      }

      
      header h1 { word-break:break-word; }

    }

    
    @media (max-width: 360px) {
      iframe { height:360px; }
      #cropPreviewWrap { width:200px; height:200px; }
      header img { width:52px; height:52px; }
      header h1 { font-size:24px; }
      button { font-size:15px; padding:10px 16px; }
    }

   
    button:focus, input:focus, textarea:focus {
      outline:3px solid rgba(242,182,28,0.3);
      outline-offset:2px;
    }
  </style>
</head>
<body>

<!-- MODAL KADROWANIA ZDJĘCIA -->
<div id="cropModal">
  <div id="cropBox">

    <div id="cropPreviewWrap">
      <img id="cropImage" alt="Do kadrowania" />
    </div>
    <h3 style="margin:16px 0 12px 0; font-weight:600; font-size:15px; color:#222;">
      Wykadruj zdjęcie, przesuwając prostokątny obszar i zmieniając jego wielkość.<br>
      Zoom można zmienić, scrollując kółkiem myszy.
    </h3>

    <!-- PANELE NARZĘDZI -->
    <div style="margin-top:16px; text-align:center;">

      
      <div style="margin-bottom:18px; display:none">
        <label style="font-weight:bold;">Zoom</label><br>
        <input type="range" id="zoomSlider" min="0.2" max="3" step="0.01" value="1" style="width:260px;">
      </div>

      
      <div style="margin-bottom:18px; display:none">
        <label style="font-weight:bold;">Obrót</label><br>
        <input type="range" id="rotateSlider" min="-180" max="180" step="1" value="0" style="width:260px;">
      </div>

      <!-- RESET -->
      <button id="cropReset" style="margin-top:10px; background:#fff; border:1px solid; padding:10px 16px; color:#000;">Reset</button>

      <div style="margin-top:12px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button id="cropApply" style="background:#F2B61C; color:#444; padding:10px 18px; border-radius:8px;">Zastosuj</button>
        <button id="cropCancel" style="background:#ccc; color:#222; padding:10px 18px; border-radius:8px;">Anuluj</button>
      </div>
    </div>

  </div>
</div>

<header>
  <img src="https://cdn.prod.website-files.com/6870d2c866689ccb626d3a34/69ebc56e17856f440e66829c_Frame%201%20(3).png" alt="Logo" />
  <h1>APEO - GENERATOR STOPKI E-MAIL</h1>
</header>

<div class="container">

  <div class="form-card" aria-labelledby="form-heading">
    <h2 id="form-heading" style="font-size:18px; margin:0 0 8px 0;">Dane kontaktowe</h2>

    <label for="name">Imię i nazwisko</label>
    <input id="name" placeholder="Jan Kowalski" type="text"/>

    <label for="position">Stanowisko</label>
    <input id="position" placeholder="Customer Service Manager" type="text"/>

    <label for="dept">Departament</label>
    <input id="dept" placeholder="SALES DEPARTMENT" type="text"/>

    <label for="city">Miasto</label>
    <input id="city" placeholder="Racibórz" type="text"/>

    <label for="phone">Telefon</label>
    <input id="phone" placeholder="+48 123 456 789" type="text"/>

    <label for="email">Email</label>
    <input id="email" placeholder="jan.kowalski@nestfoam.pl" type="email"/>

    <label for="photo">Zdjęcie (jpg/png)</label>
    <input type="file" id="photo" accept="image/*" />
    <img id="photoPreview" style="border-radius:50%; display:none; width:120px; height:120px; margin-top:10px; object-fit:cover;" alt="Podgląd zdjęcia" />

    <button id="generateBtn" style="margin-top:20px;">Generuj stopkę</button>
  </div>

  <div class="preview" aria-label="Podgląd stopki">
    <h2 style="font-size:30px; line-height:80%; margin-top:0px">PODGLĄD</h2>

    <div class="iframe-wrap" role="region" aria-label="Podgląd HTML">
      <iframe id="signatureIframe" sandbox="allow-same-origin" title="Podgląd stopki"></iframe>

    
      <div class="actions">
        <button id="downloadHtml">Pobierz HTML</button>
        <button id="downloadTxt">Pobierz TXT</button>
        <button id="copyBtn" style="background:#444;color:#fff">Kopiuj TXT do schowka</button>
      </div>
    </div>
  </div>

</div>

<script>
let photoDataUrl = "";
const defaultPhoto = "https://cdn.prod.website-files.com/6870d2c866689ccb626d3a34/69242247e4b98f17174ab70e_Ellipse%2011.png";

const photoInput = document.getElementById("photo");
const photoPreview = document.getElementById("photoPreview");

let cropper;
const cropModal = document.getElementById("cropModal");
const cropImage = document.getElementById("cropImage");
const cropApply = document.getElementById("cropApply");
const cropCancel = document.getElementById("cropCancel");

photoInput.addEventListener("change", function(e){
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(ev){
    cropImage.src = ev.target.result;

    cropModal.style.display = "flex";

    if (cropper) {
      try { cropper.destroy(); } catch(e) {}
      cropper = null;
    }

    cropper = new Cropper(cropImage, {
      viewMode: 2,
      dragMode: "move",
      aspectRatio: 1,
      autoCropArea: 1,
      responsive: true,
      background: false,
      guides: false,
      zoomable: true,
      movable: true,
      rotatable: true
    });
  };
  reader.readAsDataURL(file);
});

cropCancel.addEventListener("click", () => {
  cropModal.style.display = "none";
  if (cropper) try { cropper.destroy(); } catch(e){}
});

const zoomSlider = document.getElementById("zoomSlider");
const rotateSlider = document.getElementById("rotateSlider");
const cropReset = document.getElementById("cropReset");

if (zoomSlider) {
  zoomSlider.addEventListener("input", () => {
    if (!cropper) return;
    const newVal = parseFloat(zoomSlider.value);

    const data = cropper.getData();
    const prevZoom = (data && data.scaleX) ? data.scaleX : 1;
    const factor = newVal / prevZoom;

    cropper.zoom(factor);
  });
}

if (rotateSlider) {
  rotateSlider.addEventListener("input", () => {
    if (!cropper) return;
    const deg = parseFloat(rotateSlider.value);
    cropper.rotateTo(deg);
  });
}

// RESET wszystkich ustawień
if (cropReset) {
  cropReset.addEventListener("click", () => {
    if (!cropper) return;

    cropper.reset();

    if (zoomSlider) zoomSlider.value = 1;
    if (rotateSlider) rotateSlider.value = 0;
  });
}

cropApply.addEventListener("click", () => {
  if (!cropper) return;

  const baseCanvas = cropper.getCroppedCanvas({ width: 300, height: 300 });

  const size = 300;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");

  ctx.clearRect(0,0,size,size);
  ctx.beginPath();
  ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
  ctx.closePath();
  ctx.clip();

  ctx.drawImage(baseCanvas, 0, 0, size, size);

  photoDataUrl = canvas.toDataURL("image/png");

  photoPreview.src = photoDataUrl;
  photoPreview.style.display = "block";

  cropModal.style.display = "none";
  try { cropper.destroy(); } catch(e){}
  cropper = null;

  generateSignature();
});

// Re-generate when fields change
['name','position','dept','city','phone','email'].forEach(id=>{
  const el = document.getElementById(id);
  if (el) el.addEventListener('input', generateSignature);
});

document.getElementById("generateBtn").addEventListener("click", function(){
  generateSignature();
  // on mobile, scroll preview into view for convenience
  try {
    const preview = document.querySelector('.preview');
    if (preview) preview.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch(e) {}
});

function escapeHtml(str){ return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }


function generateSignature(){
  const name = escapeHtml(document.getElementById("name").value);
  const position = escapeHtml(document.getElementById("position").value);
  const dept = escapeHtml(document.getElementById("dept").value);
  const city = escapeHtml(document.getElementById("city").value);
  const phone = escapeHtml(document.getElementById("phone").value);
  const email = escapeHtml(document.getElementById("email").value);
  const photo = photoDataUrl || defaultPhoto;

  const signatureHtml = `

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
  <tr>
    <td align="left">

      <!-- WRAPPER 600px -->
      <table width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; border-collapse:collapse; font-family:Arial, sans-serif; color:#000;">

        <!-- GÓRA -->
        <tr>
          <td>

            <table width="100%" cellpadding="0" cellspacing="0" border="0">

              <tr>
                <!-- LOGO -->
                <td width="120" valign="top" style="padding-right:10px;">
                  <img src="https://cdn.prod.website-files.com/6870d2c866689ccb626d3a34/69ebc56e17856f440e66829c_Frame%201%20(3).png"
                       width="120" style="display:block; border:0;">
                </td>

                <!-- DANE -->
                <td valign="top">

                  <table width="100%" cellpadding="0" cellspacing="0" border="0">

                    <tr>
                      <!-- ZDJĘCIE -->
                      <td width="140" valign="top" style="padding-right:16px;">
                        <img src="${photo}" width="120" height="120"
                             style="display:block; border-radius:50%; object-fit:cover;">
                      </td>

                      <!-- TEKST -->
                      <td valign="middle">

                        <table width="100%" cellpadding="0" cellspacing="0" border="0">

                          <tr>
                            <td style="font-size:20px; font-weight:bold; line-height:22px;">
                              ${name}
                            </td>
                          </tr>

                          <tr>
                            <td style="font-size:12px; padding-top:4px;">
                              ${position}
                            </td>
                          </tr>

                          <tr>
                            <td style="font-size:12px; padding-top:2px; color:#777;">
                              ${dept}
                            </td>
                          </tr>

                          <!-- KONTAKT -->
                          <tr>
                            <td style="padding-top:8px;">

                              <table cellpadding="0" cellspacing="0" border="0" style="font-size:10px; line-height:12px;">

                                <tr>
                                  <td width="18">
                                    <img src="https://cdn.prod.website-files.com/6870d2c866689ccb626d3a34/69ebc6643311262a72d2511f_domain_24dp_E3E3E3_FILL0_wght200_GRAD0_opsz24%202%20(1).png" width="16">
                                  </td>
                                  <td style="padding-left:6px;">
                                    ${city}
                                  </td>
                                </tr>

                                <tr>
                                  <td width="18">
                                    <img src="https://cdn.prod.website-files.com/6870d2c866689ccb626d3a34/69ebc67ef799724611e44a3b_call_24dp_E3E3E3_FILL0_wght200_GRAD0_opsz24%202.png" width="16">
                                  </td>
                                  <td style="padding-left:6px;">
                                    ${phone}
                                  </td>
                                </tr>

                                <tr>
                                  <td width="18">
                                    <img src="https://cdn.prod.website-files.com/6870d2c866689ccb626d3a34/69ebc6cbe543146a78b97d38_mail_24dp_E3E3E3_FILL0_wght200_GRAD0_opsz24%202.png" width="16">
                                  </td>
                                  <td style="padding-left:6px;">
                                    <a href="mailto:${email}" style="color:#000; text-decoration:none;">
                                      ${email}
                                    </a>
                                  </td>
                                </tr>

                              </table>

                            </td>
                          </tr>

                        </table>

                      </td>
                    </tr>

                  </table>

                </td>
              </tr>

            </table>

          </td>
        </tr>

        <!-- LINIA -->
        <tr>
          <td style="padding-top:10px;">
            <table width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="border-bottom:2px solid #00A19A; font-size:0; line-height:0;">
                  &nbsp;
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- WWW -->
        <tr>
          <td style="padding-top:10px;">
            <table cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td valign="middle">
                  <a href="https://www.apeo.com.pl" style="color:#000; text-decoration:none; font-size:12px;">
                    <img src="https://cdn.prod.website-files.com/6870d2c866689ccb626d3a34/69ebc9013e2c5e41798f6775_Vector%20(1).png"
                         width="16"
                         style="vertical-align:middle; margin-right:4px;">
                    www.apeo.com.pl
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- STOPKA -->
        <tr>
          <td style="font-size:9px; color:#444; padding-top:10px; line-height:1.4;">
            APEO Sp. z o.o. Sp. k. ul. Mała 3, 64-130 Rydzyna, e-mail:
            <a href="mailto:biuro@apeo.com.pl" style="color:#444; text-decoration:none;">
              biuro@apeo.com.pl
            </a>,
            NIP: 6972410059 | REGON: 542766930 | KRS: 0001194870,<br>
            Sąd Rejonowy w Poznaniu – Nowe Miasto i Wilda, IX Wydział Gospodarczy KRS,
            Kapitał zakładowy: 5 000 PLN
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>`;

  const iframe = document.getElementById("signatureIframe");
  iframe.srcdoc = signatureHtml;

  window._lastSignatureHtml = signatureHtml;
}

generateSignature();

document.getElementById("downloadHtml").addEventListener("click", function(){
  const content = window._lastSignatureHtml || "";
  const blob = new Blob([content], {type: "text/html;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "nestfoam-signature.html"; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

document.getElementById("downloadTxt").addEventListener("click", function(){
  const content = window._lastSignatureHtml || "";
  const blob = new Blob([content], {type: "text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "nestfoam-signature.txt"; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

document.getElementById("copyBtn").addEventListener("click", function(){
  const content = window._lastSignatureHtml || "";
  navigator.clipboard.writeText(content)
    .then(()=>alert("Skopiowano kod"))
    .catch(()=>alert("Błąd kopiowania"));
});
</script>

</body>
</html>
